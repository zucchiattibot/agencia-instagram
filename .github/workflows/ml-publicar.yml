name: Publicar en Mercado Libre

on:
  push:
    paths:
      - 'ml-queue/pending/**'
      - 'ml-queue/borrar/**'
      - 'ml-queue/cmd/**'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar pendientes
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -u
          mkdir -p ml-queue/done ml-queue/vence ml-queue/hist
          ml_snapshot() {
            set +u
            mkdir -p ml-queue/hist
            HD=$(date -u +%F)
            TG=$(curl -sS https://api.mercadolibre.com/trends/MLA -H "Authorization: Bearer $TOKEN")
            printf '%s' "$TG" | jq -e 'type=="array"' >/dev/null 2>&1 || TG='[]'
            GK=$(printf '%s' "$TG" | jq -c '[.[:30][] | .keyword]')
            echo '{}' > /tmp/hc.json
            if [ -s ml-queue/watch.json ]; then
              jq -c '(.watch // [])[:5][]' ml-queue/watch.json > /tmp/watch.lines 2>/dev/null
              while IFS= read -r W; do
                WQ=$(printf '%s' "$W" | jq -r '.q // empty'); WC=$(printf '%s' "$W" | jq -r '.cat // empty' | tr -cd 'A-Za-z0-9')
                if [ -z "$WC" ] && [ -n "$WQ" ]; then WC=$(curl -sS -G https://api.mercadolibre.com/sites/MLA/domain_discovery/search --data-urlencode "q=$WQ" --data-urlencode limit=1 | jq -r '.[0].category_id // empty' 2>/dev/null); fi
                [ -z "$WC" ] && continue
                WT=$(curl -sS "https://api.mercadolibre.com/trends/MLA/$WC" -H "Authorization: Bearer $TOKEN"); printf '%s' "$WT" | jq -e 'type=="array"' >/dev/null 2>&1 || WT='[]'
                WH=$(curl -sS "https://api.mercadolibre.com/highlights/MLA/category/$WC" -H "Authorization: Bearer $TOKEN"); printf '%s' "$WH" | jq -e '(.content // null) | type=="array"' >/dev/null 2>&1 || WH='{"content":[]}'
                jq -c --arg c "$WC" --arg q "$WQ" --argjson t "$WT" --argjson h "$WH" '. + {($c):{q:$q,trends:[$t[:20][] | .keyword],best:[$h.content[:20][] | .id]}}' /tmp/hc.json > /tmp/hc2.json && mv /tmp/hc2.json /tmp/hc.json
              done < /tmp/watch.lines
            fi
            echo '[]' > /tmp/hm.json
            MEID=$(curl -sS https://api.mercadolibre.com/users/me -H "Authorization: Bearer $TOKEN" | jq -r '.id // empty')
            if [ -n "$MEID" ]; then
              IDS=""
              for ST in active paused; do
                OFF=0
                while [ "$OFF" -lt 300 ]; do
                  PG=$(curl -sS "https://api.mercadolibre.com/users/$MEID/items/search?status=$ST&limit=50&offset=$OFF" -H "Authorization: Bearer $TOKEN")
                  L=$(printf '%s' "$PG" | jq -r '(.results // []) | join(" ")')
                  [ -z "$L" ] && break
                  IDS="$IDS $L"; OFF=$((OFF+50))
                  [ "$(printf '%s' "$PG" | jq -r '(.results // []) | length')" -lt 50 ] && break
                done
              done
              set -- $IDS
              while [ $# -gt 0 ]; do
                CH=""; N=0
                while [ $# -gt 0 ] && [ $N -lt 20 ]; do CH="$CH,$1"; shift; N=$((N+1)); done
                R=$(curl -sS "https://api.mercadolibre.com/items?ids=${CH#,}&attributes=id,price,sold_quantity,available_quantity" -H "Authorization: Bearer $TOKEN")
                printf '%s' "$R" | jq -c '[.[]? | select(.code==200) | .body | [.id,.price,.sold_quantity,.available_quantity]]' > /tmp/r1.json 2>/dev/null || echo '[]' > /tmp/r1.json
                jq -c -s '.[0] + .[1]' /tmp/hm.json /tmp/r1.json > /tmp/hm2.json && mv /tmp/hm2.json /tmp/hm.json
              done
            fi
            [ -s ml-queue/hist/historial.json ] || echo '{"dias":[]}' > ml-queue/hist/historial.json
            jq -c --arg d "$HD" --argjson g "$GK" --slurpfile c /tmp/hc.json --slurpfile m /tmp/hm.json '.dias = ((((.dias // []) | map(select(.d != $d))) + [{d:$d,gen:$g,cats:$c[0],mis:$m[0]}]) | .[-60:])' ml-queue/hist/historial.json > /tmp/hh.json && mv /tmp/hh.json ml-queue/hist/historial.json
          }
          RESP=$(curl -sS -X POST https://api.mercadolibre.com/oauth/token \
            -H 'accept: application/json' -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode grant_type=refresh_token --data-urlencode client_id="$ML_CLIENT_ID" \
            --data-urlencode client_secret="$ML_CLIENT_SECRET" --data-urlencode refresh_token="$ML_REFRESH_TOKEN")
          TOKEN=$(printf '%s' "$RESP" | jq -r '.access_token // empty')
          NEWREF=$(printf '%s' "$RESP" | jq -r '.refresh_token // empty')
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          [ -n "$NEWREF" ] && echo "::add-mask::$NEWREF"
          if [ -n "$NEWREF" ]; then gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEWREF"; fi
          for f in ml-queue/pending/*.json; do
            [ -e "$f" ] || continue
            ID=$(basename "$f" .json)
            [ -e "ml-queue/done/$ID.json" ] && continue
            if [ -z "$TOKEN" ]; then
              jq -n --arg e "No pude renovar el acceso a Mercado Libre: $(printf '%s' "$RESP" | jq -c '{error,message}')" '{ok:false,error:$e}' > "ml-queue/done/$ID.json"; continue
            fi
            PIC=$(curl -sS -X POST https://api.mercadolibre.com/pictures/items/upload -H "Authorization: Bearer $TOKEN" -F "file=@ml-queue/media/$ID.jpg")
            PID=$(printf '%s' "$PIC" | jq -r '.id // empty')
            if [ -z "$PID" ]; then
              jq -n --arg e "No se pudo subir la foto: $(printf '%s' "$PIC" | head -c 300)" '{ok:false,error:$e}' > "ml-queue/done/$ID.json"; continue
            fi
            PICS=$(jq -cn --arg p "$PID" '[{id:$p}]')
            NF=$(jq -r '.fotos // 0' "$f")
            for i in $(seq 1 "$NF"); do
              if [ -e "ml-queue/media/$ID-$i.jpg" ]; then
                P2=$(curl -sS -X POST https://api.mercadolibre.com/pictures/items/upload -H "Authorization: Bearer $TOKEN" -F "file=@ml-queue/media/$ID-$i.jpg")
                PI=$(printf '%s' "$P2" | jq -r '.id // empty')
                if [ -n "$PI" ]; then PICS=$(printf '%s' "$PICS" | jq -c --arg p "$PI" '. + [{id:$p}]'); fi
              fi
            done
            TIT=$(jq -r '.titulo' "$f")
            CAT=$(jq -r '.categoria // empty' "$f")
            if [ -z "$CAT" ]; then
              CAT=$(curl -sS -G https://api.mercadolibre.com/sites/MLA/domain_discovery/search --data-urlencode "q=$TIT" --data-urlencode limit=1 | jq -r '.[0].category_id // empty')
            fi
            MARCA=$(jq -r '.marca // empty' "$f"); [ -z "$MARCA" ] && MARCA="Genérica"
            MODELO=$(jq -r '.modelo // empty' "$f"); [ -z "$MODELO" ] && MODELO="$TIT"
            CATATTR=$(curl -sS "https://api.mercadolibre.com/categories/$CAT/attributes" -H "Authorization: Bearer $TOKEN")
            IVA=$(jq -r '.iva // "21 %"' "$f"); IMP=$(jq -r '.imp // "0 %"' "$f")
            ATTRS=$(printf '%s' "$CATATTR" | jq -c --arg b "$MARCA" --arg m "$MODELO" --arg iva "$IVA" --arg imp "$IMP" 'def nz($s): ($s | gsub(" ";"") | ascii_downcase); def put($a;$n): (($a.values // []) | map(select(nz(.name) == nz($n))) | .[0].id // null) as $x | if $x then {id:$a.id,value_id:$x} else {id:$a.id,value_name:$n} end; [ .[] | . as $a | $a.id as $i | if $i=="BRAND" then {id:"BRAND",value_name:$b} elif $i=="MODEL" then {id:"MODEL",value_name:$m} elif $i=="EMPTY_GTIN_REASON" then {id:"EMPTY_GTIN_REASON",value_id:"17055160"} elif $i=="VALUE_ADDED_TAX" then put($a;$iva) elif $i=="IMPORT_DUTY" then put($a;$imp) else empty end ]' 2>/dev/null) || ATTRS='[]'
            [ -z "$ATTRS" ] && ATTRS='[]'
            EXTRA=$(jq -c '.atributos // []' "$f" 2>/dev/null || echo '[]'); GT=$(jq -r '.gtin // empty' "$f")
            A2=$(jq -cn --argjson a "$ATTRS" --argjson e "$EXTRA" --arg g "$GT" '($e|map(.id)) as $ids | ($a|map(select(.id as $i | (($ids|index($i))==null) and (($g=="") or ($i!="EMPTY_GTIN_REASON"))))) + $e + (if $g!="" then [{id:"GTIN",value_name:$g}] else [] end)' 2>/dev/null) && ATTRS="$A2"
            SHIP=$(jq -c '(if (.envioGratis==true or (.paquete // "") != "") then {mode:"me2",local_pick_up:false} else {} end) + (if .envioGratis==true then {free_shipping:true} else {} end) + (if (.paquete // "") != "" then {dimensions:.paquete} else {} end)' "$f" 2>/dev/null || echo '{}')
            FALTAN=$(printf '%s' "$CATATTR" | jq -r '[.[] | select(.tags.required==true or .tags.catalog_required==true or .tags.conditional_required==true) | .id + " (" + .name + ")"] | join(", ")' 2>/dev/null)
            BODY=$(jq --arg c "$CAT" --arg pid "$PID" --argjson at "$ATTRS" --argjson pics "$PICS" --argjson sh "$SHIP" '{title:.titulo,category_id:$c,price:(.precio|tonumber),currency_id:"ARS",available_quantity:(.cantidad|tonumber),buying_mode:"buy_it_now",condition:"new",listing_type_id:.listing,pictures:$pics,attributes:$at} + (if ($sh|length)>0 then {shipping:$sh} else {} end)' "$f")
            RES=$(curl -sS -X POST https://api.mercadolibre.com/items -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
            IDML=$(printf '%s' "$RES" | jq -r '.id // empty')
            if [ -z "$IDML" ] && printf '%s' "$RES" | grep -q 'family_name'; then
              BODY=$(printf '%s' "$BODY" | jq --arg t "$TIT" 'del(.title) | .family_name=$t')
              RES=$(curl -sS -X POST https://api.mercadolibre.com/items -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
              IDML=$(printf '%s' "$RES" | jq -r '.id // empty')
            fi
            DESC=false
            if [ -z "$IDML" ]; then
              BAD=$(printf '%s' "$RES" | jq -c '[.cause[]? | (.message // "") | capture("Attribute \\[(?<a>[A-Z0-9_]+)\\] is not valid")? | .a]' 2>/dev/null || echo '[]')
              if [ -n "$BAD" ] && [ "$BAD" != "[]" ]; then
                BODY=$(printf '%s' "$BODY" | jq --argjson b "$BAD" '.attributes |= map(select(.id as $i | ($b|index($i))==null))')
                RES=$(curl -sS -X POST https://api.mercadolibre.com/items -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
                IDML=$(printf '%s' "$RES" | jq -r '.id // empty')
                [ -n "$IDML" ] && DESC="$BAD"
              fi
            fi
            SINENVIO=false
            if [ -z "$IDML" ] && [ "$SHIP" != "{}" ]; then
              BODY=$(printf '%s' "$BODY" | jq 'del(.shipping)')
              RES=$(curl -sS -X POST https://api.mercadolibre.com/items -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY")
              IDML=$(printf '%s' "$RES" | jq -r '.id // empty')
              [ -n "$IDML" ] && SINENVIO=true
            fi
            if [ -n "$IDML" ]; then
              jq '{plain_text:.descripcion}' "$f" | curl -sS -X POST "https://api.mercadolibre.com/items/$IDML/description" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @- > /dev/null
              PAUSADA=0
              if [ "$(jq -r '.pausar // false' "$f")" = "true" ]; then
                PR=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$IDML" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"paused"}')
                if [ "$(printf '%s' "$PR" | jq -r '.status // empty')" = "paused" ]; then PAUSADA=1; fi
              fi
              VD=$(jq -r '.venceDias // 0' "$f"); VA=$(jq -r '.venceAccion // "borrar"' "$f")
              if [ "$VD" -gt 0 ] 2>/dev/null; then jq -n --arg id "$IDML" --arg v "$(date -u -d "+$VD days" +%F)" --arg a "$VA" '{id:$id,vence:$v,accion:$a}' > "ml-queue/vence/$IDML.json"; fi
              jq -n --arg id "$IDML" --arg l "$(printf '%s' "$RES" | jq -r '.permalink // empty')" --arg c "$CAT" --arg ps "$PAUSADA" --arg se "$SINENVIO" --arg ds "$DESC" '{ok:true,id:$id,permalink:$l,categoria:$c,pausada:($ps=="1"),sinEnvio:($se=="true"),descartados:$ds}' > "ml-queue/done/$ID.json"
            else
              jq -n --arg e "$(printf '%s' "$RES" | jq -c '{message,error,cause}')" --arg c "$CAT" --arg fl "$FALTAN" '{ok:false,error:$e,categoria:$c,faltan:$fl}' > "ml-queue/done/$ID.json"
            fi
            git rm -q --ignore-unmatch -- "ml-queue/media/$ID.jpg" ml-queue/media/$ID-*.jpg
          done
          for f in ml-queue/cmd/*.json; do
            [ -e "$f" ] || continue
            CID=$(basename "$f" .json); ACC=$(jq -r '.accion // empty' "$f"); IT=$(jq -r '.id // empty' "$f"); TS=$(jq -r '.ts // 0' "$f")
            if [ "$ACC" != "listar" ] && [ "$ACC" != "precios" ] && [ "$ACC" != "mercado" ] && [ "$ACC" != "snapshot" ] && [ "$ACC" != "costos" ] && ! printf '%s' "$IT" | grep -Eq '^MLA[0-9]+$'; then git rm -q --ignore-unmatch -- "$f"; continue; fi
            if [ -z "$TOKEN" ]; then
              if [ "$ACC" = "precios" ]; then OUTF="ml-queue/done/precios-$TS.json"; elif [ "$ACC" = "mercado" ]; then OUTF="ml-queue/done/mercado-$TS.json"; elif [ "$ACC" = "snapshot" ]; then OUTF="ml-queue/done/snapshot-$TS.json"; elif [ "$ACC" = "costos" ]; then OUTF="ml-queue/done/costos-$TS.json"; else OUTF="ml-queue/done/lista.json"; fi
              jq -n --argjson ts "$TS" '{ok:false,pedido:$ts,error:"No pude renovar el acceso a Mercado Libre"}' > "$OUTF"
              git rm -q --ignore-unmatch -- "$f"; continue
            fi
            case "$ACC" in
              listar)
                MEID=$(curl -sS https://api.mercadolibre.com/users/me -H "Authorization: Bearer $TOKEN" | jq -r '.id // empty')
                IDS=""
                for ST in active paused; do
                  OFF=0
                  while [ "$OFF" -lt 300 ]; do
                    PG=$(curl -sS "https://api.mercadolibre.com/users/$MEID/items/search?status=$ST&limit=50&offset=$OFF" -H "Authorization: Bearer $TOKEN")
                    L=$(printf '%s' "$PG" | jq -r '(.results // []) | join(" ")')
                    [ -z "$L" ] && break
                    IDS="$IDS $L"; OFF=$((OFF+50))
                    [ "$(printf '%s' "$PG" | jq -r '(.results // []) | length')" -lt 50 ] && break
                  done
                done
                echo '[]' > /tmp/items.json
                set -- $IDS
                while [ $# -gt 0 ]; do
                  CH=""; N=0
                  while [ $# -gt 0 ] && [ $N -lt 20 ]; do CH="$CH,$1"; shift; N=$((N+1)); done
                  R=$(curl -sS "https://api.mercadolibre.com/items?ids=${CH#,}&attributes=id,title,price,status,available_quantity,sold_quantity,permalink,thumbnail,start_time,date_created" -H "Authorization: Bearer $TOKEN")
                  jq -c --argjson r "$R" '. + [$r[]? | select(.code==200) | .body]' /tmp/items.json > /tmp/i2.json && mv /tmp/i2.json /tmp/items.json
                done
                echo '{}' > /tmp/v.json; echo '{}' > /tmp/w.json
                set -- $(jq -r '.[].id' /tmp/items.json)
                ALL="$*"
                while [ $# -gt 0 ]; do
                  CH=""; N=0
                  while [ $# -gt 0 ] && [ $N -lt 50 ]; do CH="$CH,$1"; shift; N=$((N+1)); done
                  V=$(curl -sS "https://api.mercadolibre.com/visits/items?ids=${CH#,}" -H "Authorization: Bearer $TOKEN")
                  jq -c --argjson v "$V" '. + (if ($v|type)=="array" then ($v|map({((.item_id // .id)|tostring):(.total_visits // .total)})|add // {}) elif ($v|type)=="object" then ($v|with_entries(select(.value|type=="number"))) else {} end)' /tmp/v.json > /tmp/v2.json && mv /tmp/v2.json /tmp/v.json
                done
                C=0
                for X in $ALL; do
                  C=$((C+1)); [ $C -gt 150 ] && break
                  W=$(curl -sS "https://api.mercadolibre.com/items/$X/visits/time_window?last=30&unit=day" -H "Authorization: Bearer $TOKEN" | jq -r '.total_visits // empty')
                  [ -n "$W" ] && jq -c --arg k "$X" --argjson w "$W" '. + {($k):$w}' /tmp/w.json > /tmp/w2.json && mv /tmp/w2.json /tmp/w.json
                done
                for F in ml-queue/vence/*.json; do [ -e "$F" ] && jq -c '{(.id):{v:.vence,a:.accion}}' "$F"; done | jq -s 'add // {}' > /tmp/ve.json
                [ -s /tmp/ve.json ] || echo '{}' > /tmp/ve.json
                jq -c --slurpfile v /tmp/v.json --slurpfile w /tmp/w.json --slurpfile ve /tmp/ve.json 'map(. + {visitas:($v[0][.id] // null),visitas30:($w[0][.id] // null),vence:($ve[0][.id].v // null),venceAccion:($ve[0][.id].a // null)})' /tmp/items.json > /tmp/i3.json && mv /tmp/i3.json /tmp/items.json
                jq -n --argjson ts "$TS" --slurpfile it /tmp/items.json '{ok:true,pedido:$ts,items:$it[0]}' > ml-queue/done/lista.json ;;
              precios)
                Q=$(jq -r '.q // empty' "$f")
                RS=$(curl -sS -G https://api.mercadolibre.com/sites/MLA/search --data-urlencode "q=$Q" --data-urlencode limit=50 -H "Authorization: Bearer $TOKEN")
                printf '%s' "$RS" | jq -e . >/dev/null 2>&1 || RS='{}'
                if [ "$(printf '%s' "$RS" | jq -r 'if (.results // null) != null then 1 else 0 end')" = "1" ]; then
                  jq -n --argjson ts "$TS" --arg q "$Q" --argjson r "$RS" 'if ($r.results // null) != null then {ok:true,pedido:$ts,q:$q,items:[$r.results[] | {id:.id,title:.title,price:.price,sold:.sold_quantity,url:.permalink,cond:.condition,envio:(.shipping.free_shipping // false),tipo:.listing_type_id}]} else {ok:false,pedido:$ts,q:$q,error:("Mercado Libre no devolvió la búsqueda: " + (($r.message // $r.error // "sin respuesta") | tostring))} end' > "ml-queue/done/precios-$TS.json"
                else
                  PS=$(curl -sS -G https://api.mercadolibre.com/products/search --data-urlencode status=active --data-urlencode site_id=MLA --data-urlencode "q=$Q" --data-urlencode limit=5 -H "Authorization: Bearer $TOKEN")
                  printf '%s' "$PS" | jq -e . >/dev/null 2>&1 || PS='{}'
                  echo '[]' > /tmp/pr.json
                  for PID in $(printf '%s' "$PS" | jq -r '.results[:5][]?.id'); do
                    PN=$(printf '%s' "$PS" | jq -r --arg i "$PID" '.results[] | select(.id==$i) | .name')
                    PI=$(curl -sS "https://api.mercadolibre.com/products/$PID/items?limit=50" -H "Authorization: Bearer $TOKEN")
                    printf '%s' "$PI" | jq -e . >/dev/null 2>&1 || PI='{}'
                    printf '%s' "$PI" | jq -c --arg n "$PN" '[.results[]? | select(.price != null) | {id:.item_id,title:$n,price:.price,sold:null,url:("https://articulo.mercadolibre.com.ar/MLA-" + ((.item_id // "") | sub("^MLA";""))),cond:.condition,envio:(.shipping.free_shipping // false),tipo:.listing_type_id}]' > /tmp/pi.json 2>/dev/null || echo '[]' > /tmp/pi.json
                    jq -c -s '(.[0] + .[1]) | unique_by(.id)' /tmp/pr.json /tmp/pi.json > /tmp/pr2.json && mv /tmp/pr2.json /tmp/pr.json
                  done
                  if [ "$(jq 'length' /tmp/pr.json)" -gt 0 ]; then
                    jq -n --argjson ts "$TS" --arg q "$Q" --slurpfile it /tmp/pr.json '{ok:true,pedido:$ts,q:$q,fuente:"catalogo",items:$it[0]}' > "ml-queue/done/precios-$TS.json"
                  else
                    jq -n --argjson ts "$TS" --arg q "$Q" --argjson r "$RS" --argjson p "$PS" '{ok:false,pedido:$ts,q:$q,error:("Mercado Libre no dejó leer la búsqueda ni el catálogo: " + (($r.message // $r.error // $p.message // $p.error // "sin respuesta") | tostring))}' > "ml-queue/done/precios-$TS.json"
                  fi
                fi ;;
              mercado)
                MT=$(jq -r '.tipo // "buscados"' "$f"); MQ=$(jq -r '.q // empty' "$f"); MC=$(jq -r '.cat // empty' "$f" | tr -cd 'A-Za-z0-9')
                MPMIN=$(jq -r '((.pmin // 0) | tonumber?) // 0' "$f"); MPMAX=$(jq -r '((.pmax // 0) | tonumber?) // 0' "$f")
                OUTM="ml-queue/done/mercado-$TS.json"
                if [ -z "$MC" ] && [ -n "$MQ" ]; then
                  MC=$(curl -sS -G https://api.mercadolibre.com/sites/MLA/domain_discovery/search --data-urlencode "q=$MQ" --data-urlencode limit=1 | jq -r '.[0].category_id // empty' 2>/dev/null)
                fi
                MCN=""
                if [ -n "$MC" ]; then MCN=$(curl -sS "https://api.mercadolibre.com/categories/$MC" -H "Authorization: Bearer $TOKEN" | jq -r '.name // empty' 2>/dev/null); fi
                if [ "$MT" = "buscados" ]; then
                  if [ -n "$MC" ]; then TU="https://api.mercadolibre.com/trends/MLA/$MC"; else TU="https://api.mercadolibre.com/trends/MLA"; fi
                  TR=$(curl -sS "$TU" -H "Authorization: Bearer $TOKEN")
                  if printf '%s' "$TR" | jq -e 'type=="array"' >/dev/null 2>&1; then
                    jq -n --argjson ts "$TS" --arg c "$MC" --arg cn "$MCN" --argjson r "$TR" '{ok:true,pedido:$ts,tipo:"buscados",cat:$c,catNombre:$cn,items:[$r[] | {keyword:(.keyword // ""),url:(.url // "")}]}' > "$OUTM"
                  else
                    jq -n --argjson ts "$TS" --arg c "$MC" --arg e "$(printf '%s' "$TR" | head -c 300)" '{ok:false,pedido:$ts,tipo:"buscados",cat:$c,error:("Mercado Libre no devolvió las búsquedas en tendencia: " + $e)}' > "$OUTM"
                  fi
                elif [ -z "$MC" ]; then
                  jq -n --argjson ts "$TS" '{ok:false,pedido:$ts,tipo:"vendidos",error:"No pude deducir la categoría. Escribí una palabra más clara (ej. libros) o una categoría (ej. MLA3025)."}' > "$OUTM"
                else
                  HL=$(curl -sS "https://api.mercadolibre.com/highlights/MLA/category/$MC" -H "Authorization: Bearer $TOKEN")
                  if printf '%s' "$HL" | jq -e '(.content // null) | type=="array"' >/dev/null 2>&1; then
                    echo '[]' > /tmp/mv.json
                    IDSI=$(printf '%s' "$HL" | jq -r '[.content[] | select((.type // "" | ascii_upcase)=="ITEM") | .id][:20] | join(",")')
                    if [ -n "$IDSI" ]; then
                      RI=$(curl -sS "https://api.mercadolibre.com/items?ids=$IDSI&attributes=id,title,price,sold_quantity,permalink,thumbnail,condition" -H "Authorization: Bearer $TOKEN")
                      printf '%s' "$RI" | jq -c --argjson hl "$HL" '[.[]? | select(.code==200) | .body | . as $b | {id:$b.id,title:$b.title,price:$b.price,sold:$b.sold_quantity,url:$b.permalink,thumb:$b.thumbnail,pos:(($hl.content | map(select(.id==$b.id)) | .[0].position) // null)}]' > /tmp/mv.json 2>/dev/null || echo '[]' > /tmp/mv.json
                    fi
                    for PID in $(printf '%s' "$HL" | jq -r '[.content[] | select((.type // "" | ascii_upcase)!="ITEM") | .id][:20][]'); do
                      PJ=$(curl -sS "https://api.mercadolibre.com/products/$PID" -H "Authorization: Bearer $TOKEN")
                      printf '%s' "$PJ" | jq -e '.name' >/dev/null 2>&1 || continue
                      printf '%s' "$PJ" | jq -c --argjson hl "$HL" --arg pid "$PID" '{id:$pid,title:(.name // $pid),price:(.buy_box_winner.price // null),sold:null,url:("https://www.mercadolibre.com.ar/p/" + $pid),thumb:((.pictures[0].url) // ""),pos:(($hl.content | map(select(.id==$pid)) | .[0].position) // null)}' > /tmp/mp.json 2>/dev/null || continue
                      jq -c -s '.[0] + [.[1]]' /tmp/mv.json /tmp/mp.json > /tmp/mv2.json && mv /tmp/mv2.json /tmp/mv.json
                    done
                    jq -n --argjson ts "$TS" --arg c "$MC" --arg cn "$MCN" --argjson mn "$MPMIN" --argjson mx "$MPMAX" --slurpfile it /tmp/mv.json '($it[0]) as $all | {ok:true,pedido:$ts,tipo:"vendidos",cat:$c,catNombre:$cn,total:($all|length),items:($all | map(select(($mn<=0 or (.price != null and .price>=$mn)) and ($mx<=0 or (.price != null and .price<=$mx)))) | sort_by(.pos // 9999))}' > "$OUTM"
                  else
                    jq -n --argjson ts "$TS" --arg c "$MC" --arg e "$(printf '%s' "$HL" | head -c 300)" '{ok:false,pedido:$ts,tipo:"vendidos",cat:$c,error:("Mercado Libre no devolvió el ranking de más vendidos de esa categoría: " + $e)}' > "$OUTM"
                  fi
                fi ;;
              snapshot)
                ( ml_snapshot ) >/dev/null 2>&1
                jq -n --argjson ts "$TS" '{ok:true,pedido:$ts}' > "ml-queue/done/snapshot-$TS.json" ;;
              pausar|activar)
                if [ "$ACC" = "pausar" ]; then NS=paused; else NS=active; fi
                R=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$IT" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"status\":\"$NS\"}")
                jq -n --arg id "$IT" --arg a "$ACC" --arg r "$(printf '%s' "$R" | head -c 300)" '{ok:true,id:$id,accion:$a,resp:$r}' > "ml-queue/done/cmd-$CID.json" ;;
              editar)
                B2=$(jq -c '(if .precio then {price:(.precio|tonumber)} else {} end) + (if .stock != null then {available_quantity:(.stock|tonumber)} else {} end) + (if (.titulo // "") != "" then {title:.titulo} else {} end)' "$f")
                R1="{}"; R2="{}"
                if [ "$B2" != "{}" ]; then R1=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$IT" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$B2"); fi
                if [ -n "$(jq -r '.descripcion // empty' "$f")" ]; then R2=$(jq '{plain_text:.descripcion}' "$f" | curl -sS -X PUT "https://api.mercadolibre.com/items/$IT/description?api_version=2" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @-); fi
                if [ "$(jq -r 'has("vence")' "$f")" = "true" ]; then
                  VD=$(jq -r '.vence // 0' "$f"); VA=$(jq -r '.venceAccion // empty' "$f"); mkdir -p ml-queue/vence
                  if [ -z "$VA" ]; then VA=$(jq -r '.accion // "borrar"' "ml-queue/vence/$IT.json" 2>/dev/null || echo borrar); fi
                  if [ "$VD" -gt 0 ] 2>/dev/null; then jq -n --arg id "$IT" --arg v "$(date -u -d "+$VD days" +%F)" --arg a "$VA" '{id:$id,vence:$v,accion:$a}' > "ml-queue/vence/$IT.json"; else git rm -q --ignore-unmatch -f -- "ml-queue/vence/$IT.json"; rm -f "ml-queue/vence/$IT.json"; fi
                fi
                jq -n --arg id "$IT" --arg a "$(printf '%s' "$R1" | head -c 300)" --arg b "$(printf '%s' "$R2" | head -c 300)" '{ok:true,id:$id,accion:"editar",item:$a,descripcion:$b}' > "ml-queue/done/cmd-$CID.json" ;;
              borrar)
                R1=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$IT" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"closed"}')
                R2=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$IT" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"deleted":"true"}')
                jq -n --arg id "$IT" --arg a "$(printf '%s' "$R1" | head -c 200)" --arg b "$(printf '%s' "$R2" | head -c 300)" '{ok:true,id:$id,accion:"borrar",cerrar:$a,borrar:$b}' > "ml-queue/done/cmd-$CID.json" ;;
              costos)
                UM=$(curl -sS https://api.mercadolibre.com/users/me -H "Authorization: Bearer $TOKEN")
                MEID=$(printf '%s' "$UM" | jq -r '.id // empty')
                NIV=$(printf '%s' "$UM" | jq -r '.seller_reputation.level_id // "sin_reputacion"')
                PW=$(printf '%s' "$UM" | jq -r '.seller_reputation.power_seller_status // ""')
                VT=$(printf '%s' "$UM" | jq -r '.seller_reputation.transactions.completed // 0')
                PR=$(jq -r '.precio // empty' "$f"); DM=$(jq -r '.dim // empty' "$f"); LT=$(jq -r '.lt // "gold_special"' "$f")
                COSTO=null; RAW=""
                if [ -n "$PR" ] && [ -n "$MEID" ]; then
                  RAW=$(curl -sS -G "https://api.mercadolibre.com/users/$MEID/shipping_options/free" -H "Authorization: Bearer $TOKEN" --data-urlencode "dimensions=$DM" --data-urlencode "item_price=$PR" --data-urlencode "listing_type_id=$LT" --data-urlencode "mode=me2" --data-urlencode "condition=new" --data-urlencode "logistic_type=drop_off" --data-urlencode "verbose=true")
                  COSTO=$(printf '%s' "$RAW" | jq -c '(.coverage.all_country.list_cost // null)' 2>/dev/null || echo null)
                  [ -z "$COSTO" ] && COSTO=null
                fi
                jq -n --argjson ts "$TS" --arg n "$NIV" --arg p "$PW" --argjson v "${VT:-0}" --argjson c "$COSTO" --arg raw "$(printf '%s' "$RAW" | head -c 300)" '{ok:true,pedido:$ts,nivel:$n,power:$p,ventas:$v,envio:$c,detalle:$raw}' > "ml-queue/done/costos-$TS.json" ;;
            esac
            git rm -q --ignore-unmatch -- "$f"
          done
          for f in ml-queue/borrar/*.json; do
            [ -e "$f" ] || continue
            ID=$(basename "$f" .json)
            if [ -z "$TOKEN" ]; then
              jq -n --arg e "No pude renovar el acceso a Mercado Libre" '{ok:false,error:$e}' > "ml-queue/done/del-$ID.json"
              git rm -q --ignore-unmatch -- "$f"; continue
            fi
            R1=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"closed"}')
            R2=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"deleted":"true"}')
            jq -n --arg id "$ID" --arg a "$(printf '%s' "$R1" | head -c 200)" --arg b "$(printf '%s' "$R2" | head -c 300)" '{ok:true,id:$id,cerrar:$a,borrar:$b}' > "ml-queue/done/del-$ID.json"
            git rm -q --ignore-unmatch -- "$f"
          done
          HOY=$(date -u +%F)
          for f in ml-queue/vence/*.json; do
            [ -e "$f" ] || continue
            VID=$(jq -r '.id // empty' "$f"); VF=$(jq -r '.vence // empty' "$f"); VAC=$(jq -r '.accion // "borrar"' "$f")
            if ! printf '%s' "$VID" | grep -Eq '^MLA[0-9]+$'; then git rm -q --ignore-unmatch -- "$f"; continue; fi
            if [ -n "$VF" ] && [ "$VF" \> "$HOY" ]; then continue; fi
            [ -z "$TOKEN" ] && continue
            if [ "$VAC" = "pausar" ]; then
              R=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$VID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"paused"}')
              jq -n --arg id "$VID" --arg r "$(printf '%s' "$R" | head -c 300)" '{ok:true,id:$id,accion:"vencio-pausar",resp:$r}' > "ml-queue/done/cmd-vence-$VID.json"
            else
              R1=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$VID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"closed"}')
              R2=$(curl -sS -X PUT "https://api.mercadolibre.com/items/$VID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"deleted":"true"}')
              jq -n --arg id "$VID" --arg a "$(printf '%s' "$R1" | head -c 200)" --arg b "$(printf '%s' "$R2" | head -c 300)" '{ok:true,id:$id,accion:"vencio-borrar",cerrar:$a,borrar:$b}' > "ml-queue/done/cmd-vence-$VID.json"
            fi
            git rm -q --ignore-unmatch -- "$f"
          done
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] && [ -n "$TOKEN" ]; then ( ml_snapshot ) >/dev/null 2>&1 || true; fi
          git config user.name "panel-ml"; git config user.email "panel-ml@users.noreply.github.com"
          git add ml-queue/done ml-queue/vence ml-queue/hist
          git commit -m "ml: resultado de publicaciones" || exit 0
          git pull --rebase -q || true
          git push
