# avisos-venc-v1 hora=9
name: Avisos de vencimientos
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar aviso de prueba aunque no haya vencimientos cerca'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: avisos-vencimientos
  cancel-in-progress: false
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Avisar vencimientos por ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRUEBA: ${{ github.event.inputs.prueba }}
        run: node avisos/vencimientos.mjs
