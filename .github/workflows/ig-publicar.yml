# ig-horario-v3: corre en minutos tranquilos (GitHub se satura en :00, :10, :20...)
name: Publicar en Instagram
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar lo que ya llegó a su hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node ig-queue/publicar.mjs
      - name: Guardar cambios
        run: |
          git config user.name "ig-auto"
          git config user.email "ig-auto@users.noreply.github.com"
          git add -A ig-queue
          if ! git diff --cached --quiet; then
            git commit -m "ig-auto: estado"
            git pull --rebase
            git push
          fi
